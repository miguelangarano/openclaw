services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    image: openclaw:dokploy
    environment:
      # --- AUTH ---
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      
      # --- API KEYS ---
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      
      # --- NETWORK ---
      OPENCLAW_GATEWAY_BIND: "0.0.0.0"
      
      # --- CONFIG ---
      # Force OpenClaw to use our custom config file which uses the env vars
      OPENCLAW_CONFIG_PATH: /app/openclaw.dokploy.json
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
      # Mount the config file into the container
      - ./openclaw.dokploy.json:/app/openclaw.dokploy.json
    ports:
      - "18789:18789"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--allow-unconfigured",
        "--bind",
         "lan",
        "--port",
        "18789",
      ]

volumes:
  openclaw_config:
  openclaw_workspace:
