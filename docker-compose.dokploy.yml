services:
  openclaw-gateway:
    build: .
    image: openclaw:dokploy
    environment:
      HOME: /home/node
      TERM: xterm-256color
      
      # --- AUTHENTICATION ---
      # Generate a token: openssl rand -hex 32
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}

      # --- MODEL PROVIDER (Deepseek via OpenRouter) ---
      # 1. Get an API key from https://openrouter.ai/keys
      # 2. Set this environment variable in Dokploy
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      
      # Note: To set the default model to Deepseek, you must configure it after deployment:
      # Option A (Web UI): Go to Settings -> Model -> Primary Model -> type "openrouter/deepseek/deepseek-r1"
      # Option B (CLI): docker compose exec openclaw-gateway openclaw models set openrouter/deepseek/deepseek-r1

      # --- WEB SESSIONS ---
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      
      # --- NETWORK ---
      OPENCLAW_GATEWAY_BIND: "0.0.0.0"
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
    ports:
      - "18789:18789"
      - "18790:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "0.0.0.0",
        "--port",
        "18789",
      ]

  # Optional: CLI tool for management (only run when needed)
  openclaw-cli:
    build: .
    image: openclaw:dokploy
    profiles: ["tools"]
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: echo
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
    entrypoint: ["node", "dist/index.js"]

volumes:
  openclaw_config:
  openclaw_workspace:
