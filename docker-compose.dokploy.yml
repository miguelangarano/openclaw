services:
  openclaw-gateway:
    # Uncomment 'build' to build locally. For Dokploy, we use the pre-built image to save resources.
    # build:
    #   context: .
    #   dockerfile: Dockerfile.dokploy
    image: ${DOCKER_IMAGE:-alpine/openclaw:latest}
    environment:
      # --- AUTH ---
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}

      BROWSER_CDP_URL: ${BROWSER_CDP_URL}
      
      # --- API KEYS ---
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      
      # --- NETWORK ---
      # OPENCLAW_GATEWAY_BIND: "0.0.0.0"
      
      # --- CONFIG ---
      # Force OpenClaw to use our custom config file which uses the env vars
      # We point to the persistent volume location so changes are saved
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.dokploy.json
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
      # Mount the repo config file as a seed template
      - ./openclaw.dokploy.json:/tmp/openclaw.dokploy.json
    ports:
      - "18789:18789"
    init: true
    restart: unless-stopped
    # 1. Check if persistent config exists in volume
    # 2. If NOT, copy from repo template (seed)
    # 3. Start Gateway
    command: >
      sh -c "if [ ! -f /home/node/.openclaw/openclaw.dokploy.json ]; then
      cp /tmp/openclaw.dokploy.json /home/node/.openclaw/openclaw.dokploy.json;
      fi &&
      node dist/index.js gateway --allow-unconfigured --bind lan --port 18789"

volumes:
  openclaw_config:
  openclaw_workspace: